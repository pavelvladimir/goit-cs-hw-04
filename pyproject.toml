[project]
name = "goit-cs-hw-04"
version = "0.1.0"
description = "Parallel keyword search with threading and multiprocessing"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "coverage[toml]>=7.10,<8",
    "mypy>=1.18,<3",
    "pytest>=8.4,<10",
    "pymarkdownlnt>=0.9,<1",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false
prerelease = "disallow"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
files = ["main.py", "search_common.py", "threading_search.py", "multiprocessing_search.py", "scripts", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*", ".uv-cache/*", "artifacts/*"]
relative_files = true
patch = ["subprocess"]
concurrency = ["multiprocessing", "thread"]
parallel = true
disable_warnings = ["no-data-collected"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 90
exclude_also = ['if __name__ == "__main__":']

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.pymarkdown]
plugins.md013.line_length = 100
plugins.md013.code_block_line_length = 100
plugins.md013.heading_line_length = 100
plugins.md013.table_line_length = 120
